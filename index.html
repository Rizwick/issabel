<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Issabel</title>
    <style>
        /* Ensures the animation fits the phone screen perfectly without scrolling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Prevents accidental zooming on mobile */
        }
        canvas {
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width, height;
    const heartText = "i love you";
    const centerName = "Issabel";
    
    // Heart Curve Formula
    function getHeartPoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    function init() {
        // Handle high-resolution phone screens (Retina/OLED)
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        ctx.scale(dpr, dpr);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
    }

    let offset = 0;
    let floatTick = 0; 

    function draw() {
        // Clear frame for 60fps performance
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, width, height);

        const centerX = width / 2;
        const centerY = height / 2;
        // Adjust scale based on screen size so it fits all phones
        const scale = Math.min(width, height) / 45;

        // 1. DRAW ROTATING HEART
        const totalWords = 110; 
        ctx.font = "bold 14px Arial, sans-serif";

        for (let i = 0; i < totalWords; i++) {
            const t = (i / totalWords) * Math.PI * 2 + offset;
            const point = getHeartPoint(t);
            
            ctx.save();
            ctx.translate(centerX + point.x * scale, centerY + point.y * scale);
            
            const nextPoint = getHeartPoint(t + 0.01);
            const angle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x);
            ctx.rotate(angle + Math.PI / 2);

            ctx.fillStyle = "#ffb2bc";
            ctx.fillText(heartText, 0, 0);
            ctx.restore();
        }

        // 2. DRAW BELLA WITH INFINITY FLOAT
        // Smooth figure-eight movement: x=sin(t), y=sin(t)*cos(t)
        const floatX = Math.sin(floatTick) * 22; 
        const floatY = (Math.sin(floatTick) * Math.cos(floatTick)) * 28;
        
        ctx.save();
        ctx.translate(centerX + floatX, centerY + floatY - 5); 
        
        ctx.font = "italic bold 38px Georgia, serif";
        ctx.fillStyle = "#ffffff";
        
        // Soft Pink Glow
        ctx.shadowBlur = 25;
        ctx.shadowColor = "rgba(255, 178, 188, 1)";
        
        ctx.fillText(centerName, 0, 0);
        ctx.restore();

        // Timing increments
        offset += 0.008;      // Rotation speed
        floatTick += 0.022;   // Float speed
        
        requestAnimationFrame(draw);
    }

    // Handle orientation changes (Portrait to Landscape)
    window.addEventListener('resize', init);
    
    init();
    draw();
</script>

</body>
</html>
